[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-discovery"
version = "1.0.0"
description = "Read-only Linux and network-device discovery over SSH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.5,<5"]

[project.scripts]
infra-discovery = "infra_discovery.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4", "build>=1.2", "setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]
